<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with warm gradient -->
  <circle cx="200" cy="200" r="180" fill="#FFF5E6"/>
  
  <!-- Building silhouette -->
  <rect x="80" y="120" width="100" height="180" rx="8" fill="#E8D4B8"/>
  <rect x="220" y="100" width="120" height="200" rx="8" fill="#D4C4A8"/>
  
  <!-- Windows -->
  <rect x="95" y="140" width="20" height="25" rx="4" fill="#FFF5E6"/>
  <rect x="125" y="140" width="20" height="25" rx="4" fill="#FFF5E6"/>
  <rect x="95" y="180" width="20" height="25" rx="4" fill="#FFF5E6"/>
  <rect x="125" y="180" width="20" height="25" rx="4" fill="#FFF5E6"/>
  <rect x="95" y="220" width="20" height="25" rx="4" fill="#FFF5E6"/>
  <rect x="125" y="220" width="20" height="25" rx="4" fill="#FFF5E6"/>
  
  <rect x="240" y="120" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="275" y="120" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="310" y="120" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="240" y="165" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="275" y="165" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="310" y="165" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="240" y="210" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="275" y="210" width="25" height="30" rx="4" fill="#FFF5E6"/>
  <rect x="310" y="210" width="25" height="30" rx="4" fill="#FFF5E6"/>
  
  <!-- Person entering (warm skin tone) -->
  <circle cx="160" cy="320" r="25" fill="#E8B89D"/>
  <rect x="145" y="345" width="30" height="45" rx="8" fill="#4A90A4"/>
  <rect x="130" y="350" width="15" height="35" rx="6" fill="#E8B89D"/>
  <rect x="175" y="350" width="15" height="35" rx="6" fill="#E8B89D"/>
  
  <!-- Person leaving (different warm skin tone) -->
  <circle cx="260" cy="310" r="22" fill="#D4A088"/>
  <rect x="246" y="332" width="28" height="40" rx="8" fill="#7B6858"/>
  <rect x="232" y="337" width="14" height="32" rx="6" fill="#D4A088"/>
  <rect x="274" y="337" width="14" height="32" rx="6" fill="#D4A088"/>
  
  <!-- Clock/check-in symbol -->
  <circle cx="320" cy="80" r="30" fill="#4A90A4"/>
  <rect x="312" y="65" width="4" height="20" rx="2" fill="white"/>
  <rect x="318" y="75" width="15" height="4" rx="2" fill="white"/>
  
  <!-- Small decorative elements -->
  <circle cx="100" cy="90" r="8" fill="#E8B89D" opacity="0.6"/>
  <circle cx="300" cy="350" r="6" fill="#7B6858" opacity="0.5"/>
  <circle cx="70" cy="280" r="5" fill="#4A90A4" opacity="0.4"/>
</svg>